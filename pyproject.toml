[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-research-system"
version = "0.1.0"
description = "Regime-Aware, News-Driven Quantitative Research System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "statsmodels>=0.14.0",
    "yfinance>=0.2.0",
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "hmmlearn>=0.3.0",
    "lightgbm>=4.0.0",
    "streamlit>=1.25.0",
    "plotly>=5.15.0",
    "matplotlib>=3.7.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "joblib>=1.3.0",
    "pyarrow>=12.0.0",
    "SQLAlchemy>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "pytest-cov>=4.0.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/quant_research"]

[tool.ruff]
line-length = 88
target-version = "py311"
